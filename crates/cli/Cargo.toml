[package]
name        = "ferrum-cli"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description = "Ferrum command-line binaries: chaind (node) and chain-cli (wallet and admin)"

[lints]
workspace = true

[dependencies]
ferrum-types = { workspace = true }
ferrum-crypto = { workspace = true }
ferrum-script = { workspace = true }
ferrum-storage = { workspace = true }
ferrum-consensus = { workspace = true }
ferrum-chain = { workspace = true }
ferrum-mempool = { workspace = true }
ferrum-wallet = { workspace = true }
ferrum-node = { workspace = true }
ferrum-rpc = { workspace = true }
ferrum-p2p = { workspace = true }
jsonrpsee = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
borsh = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
zeroize = { workspace = true }
rand_core = { workspace = true }
humantime = { workspace = true }
primitive-types = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "chaind"
path = "src/bin/chaind.rs"

[[bin]]
name = "chain-cli"
path = "src/bin/chain_cli.rs"
